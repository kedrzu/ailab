[project]
name = "bpe-rs"
version = "0.1.0"
description = "Naiwny, równoległy trening BPE w Ruście"
requires-python = ">=3.13"

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[tool.maturin]
# Bez trybu release Rust byłby kilkadziesiąt razy wolniejszy i pomiary nie miałyby sensu.
profile = "release"
